# Paseo image build with registry layer cache.
build:paseo:
  stage: build
  image: quay.io/containers/buildah:v1.43.4-immutable
  # Shared group: parallel vfs builds exhausted the runner's disk.
  resource_group: image-builds
  script:
    - |
      set -euo pipefail
      REPO="$CI_REGISTRY_IMAGE/paseo"
      TAG=$(grep '^paseo_image_tag:' pulumi/versions.yaml | awk '{print $2}')
      printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "FATAL: paseo_image_tag in pulumi/versions.yaml is not X.Y.Z"; exit 1; }
      echo "Building $REPO:$TAG"
      # Registry-backed build cache: reuse unchanged layers between runs.
      buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      # --layers dedupes; --format docker keeps HEALTHCHECK
      buildah build --layers --storage-driver=vfs --isolation=chroot \
        --format docker \
        --cache-from "$CI_REGISTRY_IMAGE/paseo/buildcache" \
        --cache-to "$CI_REGISTRY_IMAGE/paseo/buildcache" \
        --tag "$REPO:$TAG" \
        pulumi/my-apps/containers/paseo
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:$TAG"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/paseo/**
        - .gitlab/ci/paseo.yml
    - when: never

