# Container build + scan jobs for the custom container images.
# Included from the root .gitlab-ci.yml (`- local: .gitlab/ci/containers.yml`).

# Mod pins: resolve every pin against the Mod DB (bytes, modid, version, game dependency) and check
# that renovate.json tracks the game minor the image bakes. Runs the resolver straight out of the
# repo, so a pin or resolver change needs no image tag hop.
check:vints-mods:
  stage: test
  image: quay.io/containers/podman:v5.8.7-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/vintagestory-mods.yaml
        - pulumi/my-apps/containers/server/vintagestory-version.yaml
        - pulumi/my-apps/containers/server/entrypoints/**
        - renovate.json
        - .gitlab/ci/containers.yml
    - when: never
  script:
    # curl and unzip already ship in this image; only jq is missing.
    - dnf -y -q install jq
    - |
      set -euo pipefail
      VS_VERSION=$(sed -n 's/^vintagestory_version:[[:space:]]*//p' \
        pulumi/my-apps/containers/server/vintagestory-version.yaml)
      export VS_VERSION
      MINOR="${VS_VERSION%.*}"                   # 1.22.7 -> 1.22
      DS_NAME="vintagestory_mod_${MINOR//./_}"   # -> vintagestory_mod_1_22
      # Drift guard: the mods manager must point at this game minor's datasource, otherwise Renovate
      # would quietly track a game version the image does not run. A VS bump fails here until
      # renovate.json follows (two lines: the manager's datasourceTemplate + a customDatasources key).
      jq -e --arg ds "custom.$DS_NAME" --arg key "$DS_NAME" '
        ([.customManagers[] | select((.description // "") | test("vints mods"))] | length == 1)
        and ([.customManagers[] | select((.description // "") | test("vints mods"))][0].datasourceTemplate == $ds)
        and (.customDatasources | has($key))
      ' renovate.json > /dev/null
      pulumi/my-apps/containers/server/entrypoints/resolve-vints-mods.sh \
        --check --mods pulumi/my-apps/containers/server/vintagestory-mods.yaml

build:vints:
  stage: build
  image: quay.io/containers/buildah:v1.43.4-immutable
  # "max patch + 1" is read-then-write: serialise so two pipelines can't compute the same tag.
  resource_group: build-vints-server
  script:
    - |
      set -euo pipefail
      # skopeo handles registry auth and pagination
      dnf -y -q install skopeo jq curl
      REPO="$CI_REGISTRY_IMAGE/vints-server"
      TAG=$(grep '^vints_server_image_tag:' pulumi/versions.yaml | awk '{print $2}')
      printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "FATAL: vints_server_image_tag in pulumi/versions.yaml is not X.Y.Z"; exit 1; }
      MAJOR="${TAG%%.*}"; REST="${TAG#*.}"; MINOR="${REST%%.*}"
      TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not read vints-server tags from the registry"; exit 1; }
      MAX_PATCH=$(printf '%s\n' "$TAGS" | grep -E "^${MAJOR}\.${MINOR}\.[0-9]+$" \
        | sed 's/^.*\.//' | sort -n | tail -1)
      FULL_TAG="${MAJOR}.${MINOR}.$(( ${MAX_PATCH:-0} + 1 ))"
      VS_VERSION=$(sed -n 's/^vintagestory_version:[[:space:]]*//p' \
        pulumi/my-apps/containers/server/vintagestory-version.yaml)
      printf '%s' "$VS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "FATAL: vintagestory_version in containers/server/vintagestory-version.yaml is not X.Y.Z"; exit 1; }
      VS_INDEX="https://api.vintagestory.at/stable-unstable.json"
      VS_JSON=$(curl -fsSL --retry 3 "$VS_INDEX") \
        || { echo "FATAL: could not fetch $VS_INDEX"; exit 1; }
      VS_URL=$(printf '%s' "$VS_JSON" | jq -r --arg v "$VS_VERSION" '.[$v].linuxserver.urls.cdn? // empty')
      VS_MD5=$(printf '%s' "$VS_JSON" | jq -r --arg v "$VS_VERSION" '.[$v].linuxserver.md5? // empty')
      case "$VS_URL" in
        https://*) ;;
        *) echo "FATAL: VS $VS_VERSION has no https CDN url in the index (got '$VS_URL')"; exit 1 ;;
      esac
      printf '%s' "$VS_MD5" | grep -Eq '^[0-9a-f]{32}$' \
        || { echo "FATAL: VS $VS_VERSION has no md5 in the index (got '$VS_MD5')"; exit 1; }

      echo "Building $REPO:$FULL_TAG (track ${MAJOR}.${MINOR}) baking Vintage Story $VS_VERSION"
      echo "  artifact $VS_URL (md5 $VS_MD5)"
      buildah build --storage-driver=vfs --isolation=chroot \
        --build-arg "VS_VERSION=$VS_VERSION" \
        --build-arg "VS_URL=$VS_URL" \
        --build-arg "VS_MD5=$VS_MD5" \
        --tag "$REPO:$FULL_TAG" \
        --tag "$REPO:latest" \
        pulumi/my-apps/containers/server
      # A published tag is never re-pushed
      LATEST_TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not re-read vints-server tags before pushing"; exit 1; }
      if printf '%s\n' "$LATEST_TAGS" | grep -qx "$FULL_TAG"; then
        echo "FATAL: vints-server:$FULL_TAG was published while building; refusing to overwrite"; exit 1
      fi
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:$FULL_TAG" \
        "docker://$REPO:$FULL_TAG"
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:latest" \
        "docker://$REPO:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        # Deliberately narrow: the mod pins also live under containers/server/, and a pins-only
        # commit must not rebuild + republish the game image. Add any future build-context file
        # that the image needs to this list.
        - pulumi/my-apps/containers/server/Dockerfile
        - pulumi/my-apps/containers/server/entrypoints/**
        - pulumi/my-apps/containers/server/vintagestory-version.yaml
        - .gitlab/ci/containers.yml
    - when: never

build:vints-backup:
  stage: build
  image: quay.io/containers/buildah:v1.43.4-immutable
  resource_group: build-vints-backup
  script:
    - |
      set -euo pipefail
      # skopeo handles registry auth and pagination; the buildah image doesn't ship it.
      dnf -y -q install skopeo jq
      REPO="$CI_REGISTRY_IMAGE/vints-backup"
      TAG=$(grep '^vints_backup_image_tag:' pulumi/versions.yaml | awk '{print $2}')
      printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "FATAL: vints_backup_image_tag in pulumi/versions.yaml is not X.Y.Z"; exit 1; }
      MAJOR="${TAG%%.*}"; REST="${TAG#*.}"; MINOR="${REST%%.*}"
      TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not read vints-backup tags from the registry"; exit 1; }
      MAX_PATCH=$(printf '%s\n' "$TAGS" | grep -E "^${MAJOR}\.${MINOR}\.[0-9]+$" \
        | sed 's/^.*\.//' | sort -n | tail -1)
      FULL_TAG="${MAJOR}.${MINOR}.$(( ${MAX_PATCH:-0} + 1 ))"

      echo "Building $REPO:$FULL_TAG (track ${MAJOR}.${MINOR})"
      buildah build --storage-driver=vfs --isolation=chroot \
        --tag "$REPO:$FULL_TAG" \
        --tag "$REPO:latest" \
        pulumi/my-apps/containers/backup
      LATEST_TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not re-read vints-backup tags before pushing"; exit 1; }
      if printf '%s\n' "$LATEST_TAGS" | grep -qx "$FULL_TAG"; then
        echo "FATAL: vints-backup:$FULL_TAG was published while building; refusing to overwrite"; exit 1
      fi
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:$FULL_TAG" \
        "docker://$REPO:$FULL_TAG"
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:latest" \
        "docker://$REPO:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/backup/**
        - .gitlab/ci/containers.yml
    - when: never

# The mod bundle image: CI resolves + verifies every pin once and publishes the resulting depot, so
# the pod seeds its PVC depot from the registry instead of the Mod DB. `:latest` is pushed from the
# default branch only, so a feature branch can never clobber what the cluster pulls.
bake:vints-mods:
  stage: build
  image: quay.io/containers/podman:v5.8.7-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/vintagestory-mods.yaml
        - pulumi/my-apps/containers/server/vintagestory-version.yaml
        - pulumi/my-apps/containers/server/entrypoints/**
        - pulumi/my-apps/containers/mods/**
        - renovate.json
        - .gitlab/ci/containers.yml
    - when: never
  script:
    # curl and unzip already ship in this image; only jq is missing.
    - dnf -y -q install jq
    - |
      set -euo pipefail
      PINS=pulumi/my-apps/containers/server/vintagestory-mods.yaml
      VS_VERSION=$(sed -n 's/^vintagestory_version:[[:space:]]*//p' \
        pulumi/my-apps/containers/server/vintagestory-version.yaml)
      export VS_VERSION
      PIN_COUNT=$(grep -c '^[^#[:space:]]' "$PINS" || true)
      [ "$PIN_COUNT" -gt 0 ] || { echo "FATAL: $PINS pins no mods"; exit 1; }
      IMG="$CI_REGISTRY_IMAGE/vints-mods:latest"

      # The cold fetch check:vints-mods already does, staged into a real depot this time.
      pulumi/my-apps/containers/server/entrypoints/resolve-vints-mods.sh \
        --stage --mods "$PINS" --data-path .ci-depot

      # Package exactly the depot the cluster seeds from.
      rm -rf .ci-bundle
      mkdir -p .ci-bundle/depot
      cp .ci-depot/.vints-mods/catalog.json .ci-bundle/catalog.json
      cp .ci-depot/.vints-mods/depot/*.zip .ci-bundle/depot/
      jq -nc --arg v "$VS_VERSION" \
        --arg p "$(sha256sum "$PINS" | cut -d' ' -f1)" \
        --arg c "$CI_COMMIT_SHA" \
        '{vs_version: $v, pins_sha256: $p, commit: $c}' > .ci-bundle/bundle.json

      # A published bundle is always complete: one archive per pin, asserted before the push.
      ARCHIVES=$(ls .ci-bundle/depot/*.zip | wc -l)
      [ "$ARCHIVES" = "$PIN_COUNT" ] \
        || { echo "FATAL: the bundle holds $ARCHIVES archive(s) for $PIN_COUNT pin(s)"; exit 1; }

      podman build -f pulumi/my-apps/containers/mods/Dockerfile -t "$IMG" .

      # The bundle is only worth publishing if it seeds: stage the image's own /bundle into a scratch
      # data path and require the pins to install from it without a single fetch. Every branch runs
      # this, so a broken seed fails the MR pipeline and not the post-merge one.
      D=$(mktemp -d)
      mkdir -p "$D/seed"
      CTR=$(podman create "$IMG")
      podman cp "$CTR:/bundle/." "$D/seed/"
      podman rm -f "$CTR" > /dev/null
      if ! out=$(pulumi/my-apps/containers/server/entrypoints/resolve-vints-mods.sh \
        --stage --mods "$PINS" --data-path "$D/data" --seed "$D/seed" 2>&1); then
        echo "$out"
        echo "FATAL: the bundle does not seed a fresh data path"
        exit 1
      fi
      if grep -q 'downloading' <<<"$out"; then
        echo "$out"
        echo "FATAL: seeding from the bundle still fetched from the Mod DB"
        exit 1
      fi
      [ "$(ls "$D/data/Mods"/*.zip | wc -l)" = "$PIN_COUNT" ] \
        || { echo "$out"; echo "FATAL: the seeded stage did not install $PIN_COUNT mod(s)"; exit 1; }
      echo "the bundle seeds a fresh data path: $PIN_COUNT archive(s), zero fetches"

      if [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        echo "not $CI_DEFAULT_BRANCH: built and verified $IMG, leaving :latest alone"
        exit 0
      fi
      podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      podman push "$IMG"
      echo "published $IMG: $ARCHIVES archive(s) for VS $VS_VERSION"

# Container scanning
container_scanning:
  rules:
    - when: never

container_scanning:vints:
  extends: container_scanning
  stage: scan
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/vints-server:latest"
    CS_DOCKERFILE_PATH: "pulumi/my-apps/containers/server/Dockerfile"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - .gitlab/ci/containers.yml
    - when: never

container_scanning:vints-backup:
  extends: container_scanning
  stage: scan
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/vints-backup:latest"
    CS_DOCKERFILE_PATH: "pulumi/my-apps/containers/backup/Dockerfile"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/backup/**
        - .gitlab/ci/containers.yml
    - when: never


# Smoke tests: boot each built image and assert it actually starts.
smoke:vints:
  stage: smoke
  image: quay.io/containers/podman:v5.8.7-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - .gitlab/ci/containers.yml
    - when: never
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - podman rm -f smoke-vints >/dev/null 2>&1 || true
    - |
      set -e
      die() { echo "smoke FAILED: $1"; podman logs smoke-vints 2>/dev/null || true; podman rm -f smoke-vints >/dev/null 2>&1 || true; exit 1; }
      TAG="latest"
      IMG="$CI_REGISTRY_IMAGE/vints-server:$TAG"
      PINS=pulumi/my-apps/containers/server/vintagestory-mods.yaml
      VS_VERSION=$(sed -n 's/^vintagestory_version:[[:space:]]*//p' \
        pulumi/my-apps/containers/server/vintagestory-version.yaml)
      D=$(mktemp -d)
      mkdir -p "$D/data/Mods" "$D/config" "$D/empty"
      cp "$PINS" "$D/config/mods.yaml"
      PINS_COUNT=$(grep -c '^[^#[:space:]]' "$D/config/mods.yaml" || true)
      echo "VS_VERSION=$VS_VERSION TAG=$TAG PINS=$PINS_COUNT"

      # 1) the tag promises this game version: assert the baked binaries agree
      baked=$(podman run --rm "$IMG" \
        /serverfiles/VintagestoryServer --version 2>/dev/null | tr -d '[:space:]' || true)
      case "$baked" in
        *"$VS_VERSION"*) echo "baked game version OK: $baked" ;;
        *) die "image reports game version '$baked', pinned '$VS_VERSION'" ;;
      esac

      # 2) leftovers of the old installer: a stray zip and a legacy .url stamp must be pruned
      printf 'junk' > "$D/data/Mods/junk.zip"
      printf 'https://example.invalid/x.zip' > "$D/data/Mods/junk.url"

      # 3) networked stage: every pin lands in Mods/ and in the depot
      podman run --rm -u 0 -e DATA_PATH=/data \
        -v "$D/data":/data -v "$D/config":/config \
        "$IMG" /entrypoints/resolve-vints-mods.sh --stage --mods /config/mods.yaml \
        > "$D/stage.log" 2>&1 || { tail -60 "$D/stage.log"; die "staging the pins failed"; }
      cat "$D/stage.log"
      [ "$(ls "$D/data/Mods"/*.zip 2>/dev/null | wc -l)" = "$PINS_COUNT" ] \
        || { ls -la "$D/data/Mods"; die "expected one staged zip per pin ($PINS_COUNT)"; }
      [ "$(ls "$D/data/.vints-mods/depot"/*.zip 2>/dev/null | wc -l)" = "$PINS_COUNT" ] \
        || { ls -la "$D/data/.vints-mods/depot"; die "the depot does not hold one archive per pin"; }
      if ! grep -q 'prune: removed junk.zip (not in the pinned set)' "$D/stage.log"; then
        die "junk.zip was not pruned"
      fi
      if ! grep -q 'prune: removed junk.url (not in the pinned set)' "$D/stage.log"; then
        die "the legacy .url stamp was not pruned"
      fi
      echo "stage OK: $PINS_COUNT pinned mod(s) + depot"

      # 4) hermetic stage: the steady state must need no network at all
      podman run --rm --network=none -u 0 -e DATA_PATH=/data \
        -v "$D/data":/data -v "$D/config":/config \
        "$IMG" /entrypoints/resolve-vints-mods.sh --stage --mods /config/mods.yaml \
        > "$D/offline.log" 2>&1 || { tail -60 "$D/offline.log"; die "a steady-state stage needed the network"; }
      if grep -q 'downloading' "$D/offline.log"; then
        cat "$D/offline.log"
        die "the offline stage tried to download"
      fi
      echo "offline stage OK"

      # 5) a URL pin that 404s is fatal, in a fresh data dir, before the server is ever reached
      printf 'anymod: https://mods.vintagestory.at/download/1/no-such-mod.zip\n' > "$D/config/bad.yaml"
      if podman run --rm -u 0 -e DATA_PATH=/data \
        -v "$D/empty":/data -v "$D/config":/config \
        "$IMG" /entrypoints/resolve-vints-mods.sh --stage --mods /config/bad.yaml \
        > "$D/bad.log" 2>&1; then
        tail -40 "$D/bad.log"
        die "a 404 URL pin did not fail"
      fi
      [ -z "$(ls "$D/empty/Mods"/*.zip 2>/dev/null)" ] || die "a failed stage left zips in Mods/"
      echo "fail-loud stage OK"

      # 6) generate config, then shrink the world so first boot reaches WorldReady fast
      podman run --rm -u 0 -e DATA_PATH=/data -e PORT=42420 \
        -v "$D/data":/data \
        "$IMG" /bin/sh -c 'cd /serverfiles && ./VintagestoryServer --dataPath /data --genconfig >/dev/null 2>&1' \
        || die "genconfig step failed"
      sed -i 's/"MapSizeX": [0-9][0-9]*/"MapSizeX": 512/; s/"MapSizeY": [0-9][0-9]*/"MapSizeY": 128/; s/"MapSizeZ": [0-9][0-9]*/"MapSizeZ": 512/' "$D/data/serverconfig.json"

      # 7) boot on the staged set: every pinned mod must load and the world must come up
      podman run -d --name smoke-vints -u 0 \
        -e DATA_PATH=/data -e PORT=42420 \
        -v "$D/data":/data \
        "$IMG" /entrypoints/start-vints.sh \
        || die "could not start server container"
      ok=""
      for i in $(seq 1 60); do
        podman logs smoke-vints > "$D/boot.log" 2>&1 || true
        grep -q 'Entering runphase WorldReady' "$D/boot.log" && { ok=1; break; }
        [ "$(podman inspect -f '{{.State.Running}}' smoke-vints 2>/dev/null || echo false)" = "true" ] || break
        sleep 2
      done
      if [ -z "$ok" ]; then
        echo "--- boot output (no 'Entering runphase WorldReady') ---"
        tail -80 "$D/boot.log"
        die "server did not reach WorldReady"
      fi
      # every staged zip + the 3 base mods baked into the game
      if ! grep -q "Found $((PINS_COUNT + 3)) mods (0 disabled)" "$D/boot.log"; then
        grep -i 'mods' "$D/boot.log" | head -5
        die "the game did not load $((PINS_COUNT + 3)) mods"
      fi
      # a version pin's key is the mod's internal Mod ID, which the game logs in its load order
      # ("Mods, sorted by dependency: ..."); a URL pin's key is free-form, the count covers it
      while read -r key; do
        if ! grep -qE "\b$key\b" "$D/boot.log"; then
          grep -i 'sorted by dependency' "$D/boot.log" | head -2
          die "pinned mod '$key' did not load"
        fi
      done < <(grep '^[^#[:space:]]' "$D/config/mods.yaml" | grep -v 'https://' | sed 's/^[[:space:]]*//; s/:.*//')
      if grep -qi NullReferenceException "$D/boot.log"; then
        tail -80 "$D/boot.log"
        die "NullReferenceException detected"
      fi
      grep -q '"ServerAutoSave": 900' "$D/data/servermagicnumbers.json" \
        || { echo "--- servermagicnumbers.json ---"; cat "$D/data/servermagicnumbers.json"; die "ServerAutoSave not raised"; }

      # 8) regression: the console must be usable without a tty. A command written to the
      # FIFO the entrypoint holds open has to be read and handled (a tty client that
      # disconnects used to EOF stdin and mute the console for the rest of the pod's life).
      # The server only starts reading its console once the game is running, so wait for
      # RunGame first instead of racing WorldReady.
      ok=""
      for i in $(seq 1 30); do
        podman logs smoke-vints > "$D/boot.log" 2>&1 || true
        grep -q 'Entering runphase RunGame' "$D/boot.log" && { ok=1; break; }
        sleep 2
      done
      [ -n "$ok" ] || { tail -40 "$D/boot.log"; die "server never reached RunGame"; }
      podman exec smoke-vints timeout 5 /bin/sh -c 'printf "/list clients\n" > /tmp/vints-console.fifo' \
        || die "could not write to the console FIFO"
      ok=""
      for i in $(seq 1 20); do
        podman logs smoke-vints > "$D/boot.log" 2>&1 || true
        grep -q 'Handling Console Command /list clients' "$D/boot.log" && { ok=1; break; }
        sleep 1
      done
      if [ -z "$ok" ]; then
        echo "--- console output (no 'Handling Console Command') ---"
        tail -40 "$D/boot.log"
        die "the server did not read a console command from the FIFO"
      fi
      echo "console FIFO OK"
      echo "server smoke OK"
    - podman rm -f smoke-vints >/dev/null 2>&1 || true

smoke:vints-backup:
  stage: smoke
  image: quay.io/containers/podman:v5.8.7-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/backup/**
        - .gitlab/ci/containers.yml
    - when: never
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      TAG="latest"
      set -e
      D=$(mktemp -d)
      mkdir -p "$D/data/Saves" "$D/data/Playerdata" "$D/dest" "$D/tmp"
      printf 'world' > "$D/data/Saves/seed.vcdbs"
      printf '{}' > "$D/data/serverconfig.json"

      # Whitelist/bans/player data live beside the world, not inside it.
      printf '["player"]' > "$D/data/Playerdata/playerswhitelisted.json"
      # Per-mod settings live beside the world too.
      mkdir -p "$D/data/ModConfig"
      printf '{}' > "$D/data/ModConfig/primitivesurvival.json"

      # A run killed mid-tar leaves its .part behind; the prune glob never matches it.
      printf 'stale' > "$D/dest/saves-20000101T000000Z.tar.gz.part"
      podman run --rm -u 0 \
        -e DATA_PATH=/data -e BACKUP_DEST=/backups \
        -v "$D/data":/data -v "$D/dest":/backups -v "$D/tmp":/tmp \
        "$CI_REGISTRY_IMAGE/vints-backup:$TAG" \
        || { echo "backup smoke FAILED: non-zero exit"; exit 1; }
      ls "$D/dest"/saves-*.tar.gz >/dev/null 2>&1 \
        || { echo "backup smoke FAILED: no tar produced"; exit 1; }

      # Members mirror DATA_PATH: world under Saves/, serverconfig.json beside it.
      tar -tzf "$D/dest"/saves-*.tar.gz > "$D/members.txt"
      grep -qx 'Saves/seed.vcdbs' "$D/members.txt" \
        || { echo "backup smoke FAILED: world missing from tar"; cat "$D/members.txt"; exit 1; }
      grep -qx 'serverconfig.json' "$D/members.txt" \
        || { echo "backup smoke FAILED: serverconfig.json missing from tar"; cat "$D/members.txt"; exit 1; }
      # A restore without the whitelist/bans locks players out (or lets them back in).
      grep -qx 'Playerdata/playerswhitelisted.json' "$D/members.txt" \
        || { echo "backup smoke FAILED: Playerdata missing from tar"; cat "$D/members.txt"; exit 1; }
      grep -qx 'ModConfig/primitivesurvival.json' "$D/members.txt" \
        || { echo "backup smoke FAILED: ModConfig missing from tar"; cat "$D/members.txt"; exit 1; }
      # Stale .part files from a killed run must be swept, not left to accumulate.
      [ ! -f "$D/dest/saves-20000101T000000Z.tar.gz.part" ] \
        || { echo "backup smoke FAILED: stale .part not cleaned up"; ls -la "$D/dest"; exit 1; }
      echo "backup smoke OK"

# Turns a URL pin into a tracked "<internal modid>: <version>" pin, but only when that the tracked
# pin would resolve to exactly the bytes the URL served (the resolver's --promote). The line then
# costs one pod restart and zero network, and Renovate owns the updates from its next run.
promote:vints-mods:
  stage: maintenance
  image: quay.io/containers/podman:v5.8.7-immutable
  # Its own pipeline schedule (`RUN_KIND=promote`) so it never shares a pipeline with the renovate
  # job: main is fast-forward-only, and a promote branch born behind the tip can never merge.
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pulumi/my-apps/containers/server/vintagestory-mods.yaml
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_KIND == "promote"
    - when: never
  script:
    # curl and unzip already ship in this image; only jq is missing.
    - dnf -y -q install jq
    - |
      set -euo pipefail
      : "${RENOVATE_TOKEN:?RENOVATE_TOKEN is protected, so this job only runs on protected refs}"
      PINS=pulumi/my-apps/containers/server/vintagestory-mods.yaml
      VS_VERSION=$(sed -n 's/^vintagestory_version:[[:space:]]*//p' \
        pulumi/my-apps/containers/server/vintagestory-version.yaml)
      export VS_VERSION
      BRANCH="mods/promote-url-pins-$(date -u +%Y%m%dT%H%M%SZ)"

      # Cut from main's current tip, not this pipeline's checkout: a promote branch that starts
      # behind main can never merge.
      git fetch -q origin "$CI_DEFAULT_BRANCH"
      git checkout -q -B "$BRANCH" FETCH_HEAD
      echo "promoting from $CI_DEFAULT_BRANCH at $(git rev-parse HEAD)"

      # The URL lives on the pin line, so keep the pre-promote file for the MR description.
      before="$(mktemp)"
      cp "$PINS" "$before"
      out=$(pulumi/my-apps/containers/server/entrypoints/resolve-vints-mods.sh --promote --mods "$PINS")
      echo "$out"
      if git diff --quiet; then
        echo "no URL pin can be tracked byte-for-byte: nothing to do"
        exit 0
      fi
      COUNT=$(grep -c '^\[mods\] promote: ' <<<"$out" || true)

      # One block per promoted mod: the URL pin, then what it became. Push options cannot carry a
      # multi-line description, so the MR is created through the API instead.
      DESC_FILE="$(mktemp)"
      while IFS= read -r line; do
        rest="${line#*promote: }"
        ctx="${rest%% -> *}"
        key="$(tr -d '()' <<< "${ctx##* }")"
        tail="${rest#* -> }"
        track="${tail%% (fileid*}"
        fileid="${tail#*fileid }"; fileid="${fileid%%,*}"
        url="$(awk -v k="$key" 'index($0, k ":") == 1 { s = substr($0, length(k) + 2); sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); print s; exit }' "$before")"
        printf '%s\n    %s (fileid %s)\n' "$url" "$track" "$fileid" >> "$DESC_FILE"
      done < <(grep '^\[mods\] promote: ' <<<"$out")
      [[ -s "$DESC_FILE" ]] \
        || { echo "FATAL: could not build an MR description from $COUNT promote line(s)"; exit 1; }

      # Commit as the token's own user (a project access token's bot user), never as a human.
      IDENT=$(curl -fsS -H "PRIVATE-TOKEN: $RENOVATE_TOKEN" "$CI_API_V4_URL/user")
      GIT_NAME=$(jq -r '.name // empty' <<<"$IDENT")
      GIT_EMAIL=$(jq -r '.email // empty' <<<"$IDENT")
      if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
        echo "FATAL: $CI_API_V4_URL/user returned no name/email for the token"
        exit 1
      fi
      git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" \
        commit -m "chore: track $COUNT vints mod pin(s)" "$PINS"
      git push \
        "https://oauth2:$RENOVATE_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git" \
        "HEAD:refs/heads/$BRANCH"

      # Close and delete every older promote MR/branch first, so the new one supersedes them instead
      # of piling up (a stale MR is born behind main and can never fast-forward anyway).
      while read -r iid old_branch; do
        curl -fsS -o /dev/null -X PUT -H "PRIVATE-TOKEN: $RENOVATE_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$iid" \
          --data-urlencode "state_event=close"
        curl -fsS -o /dev/null -X DELETE -H "PRIVATE-TOKEN: $RENOVATE_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/branches/$(jq -rn --arg b "$old_branch" '$b|@uri')" || true
        echo "closed stale promote MR !$iid ($old_branch)"
      done < <(curl -fsS -H "PRIVATE-TOKEN: $RENOVATE_TOKEN" \
                 "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests?state=opened&per_page=100" \
                 | jq -r --arg b "$BRANCH" \
                     '.[] | select(.source_branch | startswith("mods/promote-url-pins-"))
                          | select(.source_branch != $b) | "\(.iid) \(.source_branch)"')

      RESP="$(curl -fsS -X POST -H "PRIVATE-TOKEN: $RENOVATE_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
        --data-urlencode "source_branch=$BRANCH" \
        --data-urlencode "target_branch=$CI_DEFAULT_BRANCH" \
        --data-urlencode "title=chore: promote vints mod URL pins" \
        --data-urlencode "description@$DESC_FILE" \
        --data-urlencode "remove_source_branch=true" \
        --data-urlencode "merge_when_pipeline_succeeds=true")"
      echo "opened MR !$(jq -r '.iid' <<<"$RESP"): $(jq -r '.web_url' <<<"$RESP")"

