# Container build + scan jobs for the custom container images.
# Included from the root .gitlab-ci.yml (`- local: .gitlab/ci/containers.yml`).

build:vints:
  stage: build
  image: quay.io/containers/buildah:v1.43.2-immutable
  script:
    - |
      set -euo pipefail
      # Read the deployed tag from versions.yaml; extract major.minor as the version track
      TAG=$(grep '^vints_server_image_tag:' pulumi/versions.yaml | awk '{print $2}')
      BASE="${TAG%.*}"
      # Query the GitLab container registry (Docker Registry HTTP API v2) for existing tags
      REGISTRY_TAGS=$(curl -s -u "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "https://registry.gitlab.com/v2/proxmox-k3s/proxmox-k3s-cluster/vints-server/tags/list" \
        2>/dev/null | grep -o '"tags":\[.*\]' | grep -o '"[^"]*"' | tr -d '"' \
        | grep -E "^$BASE\." | sed 's/^.*\.//' | sort -n | tail -1 || true)
      NEXT_PATCH=$(( ${REGISTRY_TAGS:-0} + 1 ))
      FULL_TAG="$BASE.$NEXT_PATCH"
      echo "Building $CI_REGISTRY_IMAGE/vints-server:$FULL_TAG (track $BASE, next patch $NEXT_PATCH)"
      buildah build --storage-driver=vfs --isolation=chroot \
        --tag "$CI_REGISTRY_IMAGE/vints-server:$FULL_TAG" \
        --tag "$CI_REGISTRY_IMAGE/vints-server:latest" \
        pulumi/my-apps/containers/server
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$CI_REGISTRY_IMAGE/vints-server:$FULL_TAG" \
        "docker://$CI_REGISTRY_IMAGE/vints-server:$FULL_TAG"
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$CI_REGISTRY_IMAGE/vints-server:latest" \
        "docker://$CI_REGISTRY_IMAGE/vints-server:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - pulumi/versions.yaml
        - .gitlab/ci/containers.yml
    - when: never

