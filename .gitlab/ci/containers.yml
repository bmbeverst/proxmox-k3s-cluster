# Container build + scan jobs for the custom container images.
# Included from the root .gitlab-ci.yml (`- local: .gitlab/ci/containers.yml`).

build:vints:
  stage: build
  image: quay.io/containers/buildah:v1.43.2-immutable
  # "max patch + 1" is read-then-write: serialise so two pipelines can't compute the same tag.
  resource_group: build-vints-server
  script:
    - |
      set -euo pipefail
      # skopeo handles registry auth and pagination; the buildah image doesn't ship it.
      dnf -y -q install skopeo jq
      REPO="$CI_REGISTRY_IMAGE/vints-server"
      # The deployed tag's major.minor is the version track. versions.yaml is repo content, so
      # validate its shape before the value is used. Moving the track also needs a change under
      # pulumi/my-apps/containers/server/, because versions.yaml no longer triggers a build.
      TAG=$(grep '^vints_server_image_tag:' pulumi/versions.yaml | awk '{print $2}')
      printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
        || { echo "FATAL: vints_server_image_tag in pulumi/versions.yaml is not X.Y.Z"; exit 1; }
      MAJOR="${TAG%%.*}"; REST="${TAG#*.}"; MINOR="${REST%%.*}"
      # skopeo follows the registry's Link pagination, so this is every tag in the repo.
      TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not read vints-server tags from the registry"; exit 1; }
      MAX_PATCH=$(printf '%s\n' "$TAGS" | grep -E "^${MAJOR}\.${MINOR}\.[0-9]+$" \
        | sed 's/^.*\.//' | sort -n | tail -1)
      FULL_TAG="${MAJOR}.${MINOR}.$(( ${MAX_PATCH:-0} + 1 ))"
      echo "Building $REPO:$FULL_TAG (track ${MAJOR}.${MINOR})"
      buildah build --storage-driver=vfs --isolation=chroot \
        --tag "$REPO:$FULL_TAG" \
        --tag "$REPO:latest" \
        pulumi/my-apps/containers/server
      # A published tag is never re-pushed: pods pull with imagePullPolicy: Always, so a re-push
      # silently changes what runs with no versions.yaml change. Re-read now that the build is done.
      LATEST_TAGS=$(skopeo list-tags --retry-times 3 \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$REPO" | jq -r '.Tags[]') \
        || { echo "FATAL: could not re-read vints-server tags before pushing"; exit 1; }
      if printf '%s\n' "$LATEST_TAGS" | grep -qx "$FULL_TAG"; then
        echo "FATAL: vints-server:$FULL_TAG was published while building; refusing to overwrite"; exit 1
      fi
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:$FULL_TAG" \
        "docker://$REPO:$FULL_TAG"
      buildah push --storage-driver=vfs \
        --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
        "$REPO:latest" \
        "docker://$REPO:latest"
  rules:
    # versions.yaml is Renovate's output (the deploy pin), so it is not a build trigger: a pin
    # bump would rebuild -> publish a new tag -> Renovate bump -> rebuild, forever.
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - .gitlab/ci/containers.yml
    - when: never

