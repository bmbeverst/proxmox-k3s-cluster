# Container scanning
container_scanning:
  rules:
    - when: never

container_scanning:vints:
  extends: container_scanning
  stage: scan
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/vints-server:latest"
    CS_DOCKERFILE_PATH: "pulumi/my-apps/containers/server/Dockerfile"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - .gitlab/ci/containers.yml
    - when: never

container_scanning:vints-backup:
  extends: container_scanning
  stage: scan
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/vints-backup:latest"
    CS_DOCKERFILE_PATH: "pulumi/my-apps/containers/backup/Dockerfile"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/backup/**
        - .gitlab/ci/containers.yml
    - when: never


# Smoke tests: boot each built image and assert it actually starts.
smoke:vints:
  stage: smoke
  image: quay.io/containers/podman:v5.8.4-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/server/**
        - .gitlab/ci/containers.yml
    - when: never
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - podman rm -f smoke-vints >/dev/null 2>&1 || true
    - |
      set -e
      die() { echo "smoke FAILED: $1"; podman logs smoke-vints 2>/dev/null || true; podman rm -f smoke-vints >/dev/null 2>&1 || true; exit 1; }
       TAG="latest"
      # The image intentionally does NOT bake the server in; the init container runs
      # install-vints.sh to download it. Replicate that. Needs egress to
      # api/cdn.vintagestory.at from the runner.
      VS_VERSION=$(grep '^vintagestory_version:' pulumi/versions.yaml | awk '{print $2}')
      D=$(mktemp -d)
      mkdir -p "$D/srv" "$D/data" "$D/config" "$D/tmp"
      : > "$D/config/mods.txt"
      echo "VS_VERSION=$VS_VERSION TAG=$TAG"
      # 1) install server files (output captured so failures are diagnosable)
      podman run --rm -u 0 \
        -e VS_VERSION="$VS_VERSION" -e DATA_PATH=/data -e PORT=42420 \
        -v "$D/srv":/serverfiles -v "$D/data":/data -v "$D/config":/config -v "$D/tmp":/tmp \
        "$CI_REGISTRY_IMAGE/vints-server:$TAG" /entrypoints/install-vints.sh \
        > "$D/install.log" 2>&1 \
        || { echo "--- install step failed (rc=$?) ---"; tail -60 "$D/install.log"; die "install step failed"; }
      grep -q "server ready" "$D/install.log" \
        || { echo "--- install output, no 'server ready' ---"; tail -60 "$D/install.log"; die "install produced no 'server ready'"; }
      echo "install OK"
      # 2) generate config, then shrink the world so first boot reaches WorldReady fast
      podman run --rm -u 0 -e DATA_PATH=/data -e PORT=42420 \
        -v "$D/srv":/serverfiles -v "$D/data":/data \
        "$CI_REGISTRY_IMAGE/vints-server:$TAG" \
        /bin/sh -c 'cd /serverfiles && ./VintagestoryServer --dataPath /data --genconfig >/dev/null 2>&1' \
        || die "genconfig step failed"
      sed -i 's/"MapSizeX": [0-9][0-9]*/"MapSizeX": 512/; s/"MapSizeY": [0-9][0-9]*/"MapSizeY": 128/; s/"MapSizeZ": [0-9][0-9]*/"MapSizeZ": 512/' "$D/data/serverconfig.json"
      # 3) boot and assert: stays up, reaches WorldReady, and does NOT NRE
      podman run -d --name smoke-vints -u 0 \
        -e DATA_PATH=/data -e PORT=42420 \
        -v "$D/srv":/serverfiles -v "$D/data":/data \
        "$CI_REGISTRY_IMAGE/vints-server:$TAG" /entrypoints/start-vints.sh \
        || die "could not start server container"
      ok=""
      for i in $(seq 1 5); do
        podman logs smoke-vints > "$D/boot.log" 2>&1 || true
        grep -qi 'create new save game data' "$D/boot.log" && { ok=1; break; }
        [ "$(podman inspect -f '{{.State.Running}}' smoke-vints 2>/dev/null || echo false)" = "true" ] || break
        sleep 1
      done
      [ -n "$ok" ] || { echo "--- boot output (no 'create new save game data') ---"; tail -80 "$D/boot.log"; die "server did not start creating the world"; }
      if grep -qi NullReferenceException "$D/boot.log"; then tail -80 "$D/boot.log"; die "NullReferenceException detected"; fi
      echo "server smoke OK"
    - podman rm -f smoke-vints >/dev/null 2>&1 || true

smoke:vints-backup:
  stage: smoke
  image: quay.io/containers/podman:v5.8.4-immutable
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - pulumi/my-apps/containers/backup/**
        - .gitlab/ci/containers.yml
    - when: never
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      TAG="latest"
      set -e
      D=$(mktemp -d)
      mkdir -p "$D/data/Saves" "$D/dest" "$D/tmp"
      printf 'world' > "$D/data/Saves/seed.vcdbs"
      podman run --rm -u 0 \
        -e DATA_PATH=/data -e BACKUP_DEST=/backups \
        -v "$D/data":/data -v "$D/dest":/backups -v "$D/tmp":/tmp \
        "$CI_REGISTRY_IMAGE/vints-backup:$TAG" \
        || { echo "backup smoke FAILED: non-zero exit"; exit 1; }
      ls "$D/dest"/saves-*.tar.gz >/dev/null 2>&1 \
        || { echo "backup smoke FAILED: no tar produced"; exit 1; }
      echo "backup smoke OK"
