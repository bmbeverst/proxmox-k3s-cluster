# Flatcar ships DRBD 8.4.11; piraeus needs >= 9. Load the cached 9.x build from a
# kernel-independent path instead of the shipped module.
# usermode_helper=disabled is REQUIRED: piraeus refuses a host-loaded DRBD without it.
# After a kernel update the cached .ko is stale: insmod fails the vermagic check and
# piraeus compiles as before, then drbd-module-cache.timer re-arms the cache.
install drbd /sbin/insmod /var/lib/drbd-modules/current/drbd.ko usermode_helper=disabled
install drbd_transport_tcp /sbin/insmod /var/lib/drbd-modules/current/drbd_transport_tcp.ko
install drbd_transport_lb_tcp /sbin/insmod /var/lib/drbd-modules/current/drbd_transport_lb_tcp.ko
install drbd_transport_rdma /sbin/insmod /var/lib/drbd-modules/current/drbd_transport_rdma.ko
