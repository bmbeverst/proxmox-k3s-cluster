# Managed by pyinfra (install_k3s.py). Drop-in so we never have to create
# the main journald.conf (Flatcar ships none).
# Storage=volatile keeps the journal in RAM only (mirrors fcar-base-tmplt.yaml
# 90-volatile.conf), capped at RuntimeMaxUse, so logs never land on disk.
[Journal]
Storage=volatile
SystemMaxUse=256M
RuntimeMaxUse=128M
