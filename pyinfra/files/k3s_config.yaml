kubelet-arg:
  - "image-gc-low-threshold=65"
  - "image-gc-high-threshold=75"
  - "system-reserved=cpu=200m,memory=384Mi"
{% if k3s_role != 'agent' %}
  # k3s server RSS ~1.65Gi; restarts k3s on apply.
  - "kube-reserved=cpu=300m,memory=1536Mi"
{% else %}
  - "kube-reserved=cpu=300m,memory=640Mi"
{% endif %}
  - "eviction-hard=memory.available<300Mi"

{% if k3s_role != 'agent' %}
systemReserved:
  cpu: "100m" # Reserve 100 millicores for OS
  memory: "150Mi" # Reserve 150MB for system processes

# kube-vip owns LB VIPs; server-only keys, agents reject them.
disable:
  - servicelb
{% endif %}

{% if k3s_role == 'agent' %}
# advertise-address is server-only; agents refuse to start with it.
node-ip: "{{ advertise_address }}"
{% else %}
advertise-address: "{{ advertise_address }}"
{% endif %}

# Proxmox host not discoverable in-guest; inventory passes it in.
node-label:
  - "proxmox-host={{ proxmox_host }}"
