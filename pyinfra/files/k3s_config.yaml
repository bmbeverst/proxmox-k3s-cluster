kubelet-arg:
  - "image-gc-low-threshold=65"
  - "image-gc-high-threshold=75"
  - "system-reserved=cpu=200m,memory=384Mi"
  - "kube-reserved=cpu=300m,memory=640Mi"
  - "eviction-hard=memory.available<300Mi"

{% if k3s_role != 'agent' %}
systemReserved:
  cpu: "100m" # Reserve 100 millicores for OS
  memory: "150Mi" # Reserve 150MB for system processes

# kube-vip owns LoadBalancer VIPs, so ServiceLB must be off.
# Server-only keys: k3s agents reject flags they don't define (systemReserved
# fatalled node5's install; ServiceLB never runs on an agent anyway).
disable:
  - servicelb
{% endif %}

{% if k3s_role == 'agent' %}
# Agents have no apiserver to advertise: advertise-address is a server-only
# flag and k3s refuses to start an agent that is given it.
node-ip: "{{ advertise_address }}"
{% else %}
advertise-address: "{{ advertise_address }}"
{% endif %}

# Which Proxmox host this VM runs on. Not discoverable from inside the guest
# (DMI reports QEMU, not the host), so the inventory passes it in.
node-label:
  - "proxmox-host={{ proxmox_host }}"
