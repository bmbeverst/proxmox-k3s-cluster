# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - test # template security scans (semgrep-sast, secret_detection) default here
  - build # build + push our custom container images
  - scan # container scanning of the images we just built
  - maintenance

# Only include the security scan templates in non-scheduled pipelines. This is
# decided at config time by $CI_PIPELINE_SOURCE, which is set by GitLab itself
# (only the scheduler produces "schedule" pipelines). We deliberately do NOT
# use SAST_DISABLED / SECRET_DETECTION_DISABLED variables: pipeline variables
# (Run pipeline form, `git push -o ci.variable=...`) take highest precedence
# and would let anyone skip the scans on demand.
include:
  - template: Security/SAST.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - template: Security/Secret-Detection.gitlab-ci.yml
    rules:
      - if: $CI_PIPELINE_SOURCE != "schedule"
  - template: Security/Container-Scanning.gitlab-ci.yml
  # Container build + scan jobs live here to keep the root pipeline lean.
  - local: .gitlab/ci/containers.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  # THE ODD ONE OUT: all versions belong in pulumi/versions.yaml, EXCEPT this one.
  # The .NET runtime tag is the sole BUILD-time version (the vints-server base
  # image); it's pinned to the exact patch here so renovate bumps it monthly and CI
  # rebuilds. Please keep every other versioned thing in versions.yaml, not here.
  # renovate: datasource=docker depName=mcr.microsoft.com/dotnet/runtime
  DOTNET_TAG: "10.0.11"

# Automatically update dependencies via Renovate
renovate:
  stage: maintenance
  image:
    # Renovate's gitlabci manager will update this
    name: renovate/renovate:44.14.7
    entrypoint: [""] # the image entrypoint is the renovate binary itself
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
  script:
    - renovate
  only:
    - schedules
