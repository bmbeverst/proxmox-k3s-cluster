[project]
name = "proxmox-k3s-cluster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pulumi>=3.165.0",
    "pulumi-esc-sdk>=0.12.1",
    "pulumi-kubernetes>=4.23.0",
    "pulumi-proxmoxve>=7.0.0",
]
[tool.uv]
link-mode = "symlink"

[tool.isort]
# Match black so the two never fight over the same lines (line length, multi-line
# import wrapping, magic trailing comma).
profile = "black"
# The Pulumi programs and the pyinfra deploy scripts live in `pulumi/` and
# `pyinfra/` at the repo root, so those names also exist as directories. Without
# this, isort treats the *installed* `pulumi` package as first-party while
# `pulumi_kubernetes`/`pulumi_proxmoxve` (separate dists) stay third-party, which
# splits one SDK block into two and reorders it. Pin them to third-party.
known_third_party = ["pulumi", "pyinfra"]
# Sibling modules imported by pulumi/my-apps/__main__.py (ghost, paseo, spoolman,
# vintagestory). Taking the directory as a source root keeps them first-party
# without listing names here, so a new app module is classified automatically.
src_paths = ["pulumi/my-apps"]

[dependency-groups]
infra = [
    "pyinfra>=3.2",
    "ansible-vault>=2.1.0",
]

lint = [
    "bandit>=1.8.3",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
]
