[project]
name = "proxmox-k3s-cluster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pulumi>=3.165.0",
    "pulumi-esc-sdk>=0.12.1",
    "pulumi-kubernetes>=4.23.0",
    "pulumi-proxmoxve>=7.0.0",
]
[tool.uv]
link-mode = "symlink"

[tool.isort]
# Match black so the two never fight.
profile = "black"
# Pulumi/pyinfra dir names shadow installed dists; isort: third-party.
known_third_party = ["pulumi", "pyinfra"]
# Sibling app modules: src_paths keeps them first-party automatically.
src_paths = ["pulumi/my-apps"]

[dependency-groups]
infra = [
    "pyinfra>=3.2",
    "ansible-vault>=2.1.0",
]

lint = [
    "bandit>=1.8.3",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "pre-commit>=4.7.0",
]
