# Hook runner for black + isort from the lint group.
#
# repo: local uses the pinned toolchain; upstream repos double-pin.
repos:
  - repo: local
    hooks:
      # No --check: hooks fix in place, then fail.
      - id: isort
        name: isort
        entry: uv run --only-group lint isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --only-group lint black
        language: system
        types: [python]
