# Mods this server runs. One entry per line: "<key>: <version|url>".
#   key    the mod's internal Mod ID -> $DATA_PATH/Mods/<key>.zip (the game keys on the modid, not
#          on the filename)
#   value  a released mod version (Renovate tracks it) or a full https .zip URL (used verbatim)
# The datasource for tracked entries lives in renovate.json (one per game minor), so adding a mod is
# one line here and nothing else.

hudclockpatch: 4.4.1
egocaribautomapmarkers: 5.0.3
sortablestorage: 3.0.0
prospecttogether: 2.2.1
smithingplus: 1.9.0-rc.1
bedspawnv2: 1.7.1

# In-game mod config/conflict UI; also a hard dependency of yangtransport (>= 1.1.2).
integratedmodmanager: 1.1.3
# Needed by the Phanerozoic dinosaur families and BetterRuins for their settings.
configlib: 1.13.2
# Draconis and its two required libraries.
draconis: 1.6.1
jaunt: 3.3.1
attributerenderinglibrary: 3.2.0
# Yang's Transport Tycoon and its two required libraries.
yangtransport: 1.0.4
collisionflowfields: 1.2.2
evilinteractionrangehack: 6.9.0
fromgoldencombs: 2.1.0
# URL-pinned (not version-pinned) so a Renovate bump cannot race the insul conversion boot.
japanesearchitecture: https://mods.vintagestory.at/download/94087
practicalelectricity: 0.9.23
betterruins: 0.6.4
# Wool & More requires ShearLib.
wool: 1.9.6
shearlib: 1.3.0
darcesdriftersredone: 1.3.0
# Legacy of the Phanerozoic (forked): the runtime plus one entry per dinosaur family.
dinocore: 2.0.0
lopustegosauria: 2.0.0
lopumacronaria: 2.0.0
lopuceratopsidae: 2.0.0
lopudromaeosauridae: 2.0.0
# Successor to japanesearchitecture 0.9.7 (author-approved 0.9.8 patch); converts 0.9.7 blocks on load.
insuljapanesearchi: 1.0.3
# Paddy Fields: last release is tagged only up to 1.22.3 and declares "game": "*".
ricepaddies: 1.0.4
apelanterns: 1.4.6
justvinegar: 1.0.1
vanillamoremolds: 2.2.0
# Stable line; 2.0.0 is still a pre-release.
realsmoke: 1.3.1
# Yang's Transport Tycoon interaction fixes (yangtransport is pinned above).
yttenhancedinteractionfiltering: 1.1.0
yangcoifix: 5.0.0
