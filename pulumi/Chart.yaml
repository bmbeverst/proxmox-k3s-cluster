# Helm v3 Chart.yaml so Renovate's built-in helmv3 manager bumps them natively.
apiVersion: v2
name: infra-base
version: 0.1.0
dependencies:
  - name: kured
    repository: https://kubereboot.github.io/charts
    version: 6.1.0
  - name: kube-vip
    repository: https://kube-vip.github.io/helm-charts
    version: 0.11.1
  - name: piraeus
    repository: oci://ghcr.io/piraeusdatastore/piraeus-operator
    version: 2.12.0
  - name: linstor-cluster
    repository: oci://ghcr.io/piraeusdatastore/helm-charts
    version: 1.2.0
  - name: cert-manager
    repository: https://charts.jetstack.io
    version: v1.21.2
  - name: victoria-metrics-single
    repository: https://victoriametrics.github.io/helm-charts/
    version: 0.47.0
  - name: kube-state-metrics
    repository: https://prometheus-community.github.io/helm-charts
    version: 8.5.0
  - name: pulumi-kubernetes-operator
    repository: oci://ghcr.io/pulumi/helm-charts
    version: 2.9.1
  - name: tailscale-operator
    repository: https://pkgs.tailscale.com/helmcharts
    version: 1.102.4
  - name: reloader
    repository: https://stakater.github.io/stakater-charts
    version: 2.2.17
